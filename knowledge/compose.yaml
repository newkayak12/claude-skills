services:
  knowledge-index:
    build:
      context: .
    volumes:
      - ${KNOWLEDGE_ROOT:?KNOWLEDGE_ROOT must be the project to index}:/workspace
    command: ["index", "--root", "/workspace", "--provider", "hash"]

  knowledge-index-ollama:
    profiles: ["semantic"]
    build:
      context: .
    volumes:
      - ${KNOWLEDGE_ROOT:?KNOWLEDGE_ROOT must be the project to index}:/workspace
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - index
      - --root
      - /workspace
      - --provider
      - ollama
      - --model
      - ${KNOWLEDGE_EMBED_MODEL:-embeddinggemma}
    depends_on:
      ollama:
        condition: service_healthy

  # LLM graph build: KNOWLEDGE_LLM_URL is any OpenAI-compatible endpoint. With
  # `--profile llm` it can be the bundled ollama (http://ollama:11434), which
  # pulls the model the hardware probe picked; a host server is reachable as
  # http://host.docker.internal:<port>.
  knowledge-graph:
    profiles: ["graph"]
    build:
      context: .
    volumes:
      - ${KNOWLEDGE_ROOT:?KNOWLEDGE_ROOT must be the project to index}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Not `:?`: compose interpolates every service, so a required value here
      # would stop `knowledge-index` too. Unset, the build says so and exits.
      KNOWLEDGE_LLM_URL: ${KNOWLEDGE_LLM_URL:-}
      KNOWLEDGE_LLM_MODEL: ${KNOWLEDGE_LLM_MODEL:-}
      KNOWLEDGE_LLM_TIER: ${KNOWLEDGE_LLM_TIER:-}
      KNOWLEDGE_LLM_API_KEY: ${KNOWLEDGE_LLM_API_KEY:-}
      KNOWLEDGE_LLM_TIMEOUT_MS: ${KNOWLEDGE_LLM_TIMEOUT_MS:-300000}
      KNOWLEDGE_LLM_PULL: ${KNOWLEDGE_LLM_PULL:-}
    entrypoint: ["node", "--no-warnings", "/opt/knowledge/scripts/knowledge-graph.mjs"]
    command: ["build", "--root", "/workspace"]

  ollama:
    profiles: ["semantic", "llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ollama-models:
