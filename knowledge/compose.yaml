services:
  knowledge-index:
    build:
      context: .
    volumes:
      - ${KNOWLEDGE_ROOT:-..}:/workspace
    command: ["index", "--root", "/workspace", "--provider", "hash"]

  knowledge-index-ollama:
    profiles: ["semantic"]
    build:
      context: .
    volumes:
      - ${KNOWLEDGE_ROOT:-..}:/workspace
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - index
      - --root
      - /workspace
      - --provider
      - ollama
      - --model
      - ${KNOWLEDGE_EMBED_MODEL:-embeddinggemma}
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    profiles: ["semantic"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ollama-models:
